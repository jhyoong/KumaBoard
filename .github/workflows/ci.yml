name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  go:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # web/embed.go embeds web/dist, which is not committed.
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "unformatted files:"
            echo "$out"
            exit 1
          fi
      - run: make vet
      - run: make test
      - name: Windows cross-build
        run: GOOS=windows GOARCH=amd64 go build ./...
        env:
          CGO_ENABLED: "0"
      - name: Windows vet
        run: GOOS=windows GOARCH=amd64 go vet ./...
        env:
          CGO_ENABLED: "0"
      - run: make agent-all
