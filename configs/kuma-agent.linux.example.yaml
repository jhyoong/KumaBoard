# /etc/kuma-agent/config.yaml  (Linux, systemd)
device:
  name: linux-box            # must match the name registered on the server

server:
  url: wss://192.168.1.150:8443/ws
  ca_file: /etc/kuma-agent/ca.pem

token_file: /etc/kuma-agent/token

capabilities:
  - metrics
  # - gpu                    # NVIDIA / AMD / Intel GPU metrics, if the host has one
  - custom-commands

# Commands are the buttons on the device page. They are defined here and only
# here: the dashboard picks one by name and can never add arguments. The
# agent re-reads this block within a few seconds of the file changing; the
# rest of the file needs a service restart.
#
#   run:     argv array, never a shell string
#   script:  absolute path of a script file. With run, it is appended as the
#            last argument; alone, it is executed directly (shebang + x bit).
#            Keep scripts in /opt/kuma-scripts (created by setup-agent.sh,
#            owned by root): the agent refuses to offer or run a script that
#            its own account could modify.
#   confirm: true makes the dashboard ask before starting. It guards against
#            misclicks only and is not a security control.
#
# Output is streamed to the dashboard while the command runs; only the last
# 64 KiB per stream is kept. A script that needs a full log writes its own.
#
# The systemd unit sandboxes the agent (ProtectSystem=strict, PrivateTmp=true,
# only /opt/kuma-agent writable) and scripts inherit that. One that must
# write elsewhere goes through an exact-match sudoers rule, the same way a
# privileged run: command does.
commands:
  uptime:
    description: "Show system uptime"
    run: ["/usr/bin/uptime"]
    timeout_s: 5
  # backup-photos:
  #   description: "Rsync photos to the NAS"
  #   script: /opt/kuma-scripts/backup-photos.sh
  #   timeout_s: 3600
  #   confirm: true
