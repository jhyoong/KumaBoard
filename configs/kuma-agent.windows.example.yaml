# C:\ProgramData\kuma-agent\config.yaml  (Windows, SCM service)
device:
  name: windows-headless

server:
  url: wss://192.168.1.150:8443/ws
  ca_file: C:\ProgramData\kuma-agent\ca.pem

token_file: C:\ProgramData\kuma-agent\token

capabilities:
  - metrics
  - custom-commands
  - wol-target

# Commands are the buttons on the device page. They are defined here and only
# here: the dashboard picks one by name and can never add arguments. The
# agent re-reads this block within a few seconds of the file changing; the
# rest of the file needs a service restart.
#
#   run:     argv array, never a shell string
#   script:  absolute path of a script file, appended to run as the last
#            argument. PowerShell scripts need the interpreter in run, as
#            below. Keep scripts in C:\kuma-scripts (created by setup.ps1,
#            owned by Administrators): the agent refuses to offer or run a
#            script that its own account could modify.
#   confirm: true makes the dashboard ask before starting. It guards against
#            misclicks only and is not a security control.
#
# Output is streamed to the dashboard while the command runs; only the last
# 64 KiB per stream is kept. A script that needs a full log writes its own.
commands:
  sleep:
    description: "Put the machine to sleep"
    run: ["powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File"]
    script: C:\kuma-scripts\sleep.ps1
    timeout_s: 15
    expect_disconnect: true
